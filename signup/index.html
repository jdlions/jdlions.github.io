<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>학생 회원가입 · PrideDesk</title>
<link rel="icon" href="../assets/images/pridedesk-icon-16.png" sizes="16x16" type="image/png"><link rel="icon" href="../assets/images/pridedesk-icon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/images/pridedesk-icon-180.png" sizes="180x180">
<link rel="stylesheet" href="../assets/css/editorial.css"><link rel="stylesheet" href="../assets/css/editorial-liquid-glass.css"><link rel="stylesheet" href="../assets/css/editorial-login.css"><link rel="stylesheet" href="../assets/css/editorial-signup.css">
</head><body class="login-page">
<main class="signup-shell"><section class="login-card" aria-labelledby="signup-title">
<img class="signup-logo" src="../assets/images/pridedesk-logo-dark-gold.webp" width="480" height="111" alt="PrideDesk">
<p class="eyebrow">The Lion's Pride</p><h1 id="signup-title">학생 회원가입</h1>
<p>기존 회원은 가입할 필요가 없습니다. 신규 학생만 공통 가입 코드로 등록합니다.</p>
<p role="status" aria-live="polite" data-signup-status>학교 Google 로그인 확인 중…</p>
<p class="muted" data-signup-account></p>
<form data-signup-form hidden>
<label class="field">공통 가입 코드<input name="code" type="password" required minlength="12" maxlength="128" autocomplete="off" aria-describedby="signup-code-help"></label>
<p id="signup-code-help" class="muted">영자신문부에서 안내받은 코드를 입력하세요.</p>
<div class="form-grid"><label class="field">이름<input name="name" required maxlength="100" autocomplete="name"></label><label class="field">현재 학번<input name="studentNumber" required pattern="[123][0-9]{4}" maxlength="5" inputmode="numeric" autocomplete="off"></label></div>
<label class="field">기수<input name="cohort" readonly aria-readonly="true"></label>
<p class="muted" data-signup-guidance></p>
<label class="signup-confirm"><input name="confirmed" type="checkbox" required> 이름·현재 학번·기수를 확인했습니다.</label>
<button class="btn-primary" type="submit">확인하고 가입</button>
</form>
<button type="button" data-signup-retry hidden>다시 확인</button>
<a class="back-link" href="../login/">Google 로그인으로 돌아가기</a>
<a class="back-link" href="https://jdlions.github.io/">The Lion's Pride 공개 홈페이지</a>
</section></main>
<script type="module" src="../assets/js/auth/signup-app.js"></script>
</body></html>
