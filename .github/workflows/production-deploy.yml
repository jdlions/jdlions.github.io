name: PrideDesk production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pridedesk-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'jdlions/jdlions.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Existing tests and build
        uses: ./.github/actions/pridedesk-validation
      - name: Build Worker static assets
        run: npm run build:static --prefix worker
      - name: Migrations, Worker, Vercel and production smoke
        run: node scripts/production-deploy.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      - name: Record release result
        if: always()
        run: |
          if [ ! -f deployment-result.json ]; then
            echo '{"status":"failure","error":"validation_or_setup_failed_before_deploy"}' > deployment-result.json
            echo 'Production release stopped during tests/setup; no deployment step ran.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload release result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-${{ github.sha }}-${{ github.run_attempt }}
          path: deployment-result.json
          if-no-files-found: ignore
