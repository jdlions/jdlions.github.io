name: PrideDesk checks
on:
  push:
    branches: [feature/pridedesk-vercel]
  pull_request:
    paths:
      - 'pridedesk/**'
      - 'worker/**'
      - 'scripts/**'
      - 'assets/**'
      - 'login/**'
      - 'admin/**'
      - 'student/**'
      - '.github/workflows/pridedesk-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker
      - run: npm run check --prefix worker
      - run: npm test --prefix pridedesk
      - run: python3 scripts/validate.py
