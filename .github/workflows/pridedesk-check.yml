name: PrideDesk checks
on:
  push:
    branches: [feature/pridedesk-vercel]
  pull_request:
    paths:
      - 'pridedesk/**'
      - 'worker/**'
      - 'scripts/**'
      - 'assets/**'
      - 'login/**'
      - 'admin/**'
      - 'student/**'
      - '.github/actions/pridedesk-validation/**'
      - '.github/workflows/pridedesk-check.yml'
      - '.github/workflows/production-deploy.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Existing tests and build
        uses: ./.github/actions/pridedesk-validation
