<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Page · The Lion's Pride</title><link rel="icon" href="../cleanlogo.png"><link rel="stylesheet" href="../assets/css/editorial.css"></head><body><a class="skip-link" href="#main">본문으로 건너뛰기</a><header class="app-header"><button class="icon-btn" data-menu aria-label="메뉴 열기">☰</button><a class="brand" href="../">The <em>Lion's</em> Pride</a><div class="header-tools"><span class="header-user" data-user-name></span></div></header><aside class="app-sidebar"><p class="side-title">마이페이지 · My Page</p><nav class="side-nav" aria-label="Student navigation"><button class="is-active" data-student-view="dashboard">한눈에 보기</button><button data-student-view="articles">내 기사</button><button data-open-upload>사진 업로드</button><button data-student-view="photos">사진 제출 내역</button><a href="../">공개 홈페이지</a></nav><div class="side-bottom"><button data-logout>로그아웃</button></div></aside><main class="app-main" id="main"><div class="page"><section class="view" data-view="dashboard"></section><section class="view" data-view="articles" hidden></section><section class="view" data-view="photos" hidden></section></div></main><div class="modal" data-article-modal role="dialog" aria-modal="true" aria-labelledby="article-modal-title"><div class="modal-card"><div class="modal-head"><h2 id="article-modal-title">기사</h2><button data-close-modal aria-label="닫기">×</button></div><div class="article-view-switch"><button data-version="original">원문</button><button data-version="edited">편집본</button></div><div class="article-view article-content" data-article-content></div></div></div><div class="modal" data-upload-modal role="dialog" aria-modal="true" aria-labelledby="upload-title"><form class="modal-card" data-upload-form><div class="modal-head"><h2 id="upload-title">사진 제출</h2><button type="button" data-close-modal aria-label="닫기">×</button></div><p class="notice">사진은 학교에서 관리하는 비공개 Google Drive 폴더에 업로드됩니다. JPG, PNG, WebP 파일을 15MB 이하로 제출해 주세요.</p><div class="grid"><label class="field"><span>관련 기사</span><select name="articleSubmissionId" required></select></label><label class="field upload-zone"><span>사진 · JPG, JPEG, PNG, WEBP</span><input name="files" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple required></label><label class="field"><span>캡션 / 설명</span><textarea name="caption" required></textarea></label><label class="field"><span>촬영자 / 출처</span><input name="photographer" required></label><label class="field"><span>출처 유형</span><select name="sourceType" required><option value="self">직접 촬영</option><option value="provided">다른 사람에게 제공받음</option><option value="other">기타</option></select></label><label class="checkbox"><input name="copyright" type="checkbox" required><span>직접 촬영했거나 제출 및 사용 허가를 받은 자료임을 확인합니다.</span></label></div><div class="form-actions"><button type="button" data-close-modal>취소</button><button class="btn-primary">제출하기</button></div></form></div><div class="toast" data-toast role="status"></div><script type="module" src="../assets/js/student/student-app.js"></script></body></html>
